name: TTSEval
options:
  bundleIdPrefix: com.voiceping
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE: false
    SUPPORTS_MAC_DESIGNED_FOR_IPAD: false
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: false

configs:
  Debug: debug
  Release: release

packages:
  SherpaOnnxKit:
    path: ../ios-android-offline-speech-translation/LocalPackages/SherpaOnnxKit

targets:
  TTSEval:
    type: application
    platform: iOS
    sources:
      - path: TTSEval
    resources:
      - path: TTSEval/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.voiceping.ttseval
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: "YES"
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0.0"
        INFOPLIST_KEY_CFBundleDisplayName: "VoicePing TTS Eval"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationAllButUpsideDown"
    dependencies:
      - package: SherpaOnnxKit
        product: SherpaOnnxKit

schemes:
  TTSEval:
    build:
      targets:
        TTSEval: all
